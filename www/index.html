<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Costafy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="wrap">
 <section id="v-home">
  <div class="topr"><div class="av">C</div><button class="chip" data-f="all" aria-pressed="true">Tudo</button><button class="chip" data-f="liked" aria-pressed="false">Curtidas</button></div>
  <div class="grid" id="grid"></div>
  <h2>Feitas para você</h2>
  <div class="hs" id="hs"></div>
  <p class="fine">Todas as faixas são originais e geradas ao vivo no seu aparelho.</p>
 </section>
 <section id="v-search" hidden><h2>Buscar</h2><input type="search" id="q" placeholder="O que você quer ouvir?" aria-label="Buscar"><div id="sl"></div></section>
 <section id="v-lib" hidden><h2>Sua Biblioteca</h2><div id="ll"></div></section>
</main>

<div class="dock">
 <div class="mini" id="mini">
  <div class="art" id="mart"></div>
  <div class="m"><b id="mt"></b><span id="ma"></span></div>
  <button class="ib" id="mlk" aria-label="Curtir"></button>
  <button class="ib" id="mpp" aria-label="Tocar"></button>
  <div class="mp"><i id="mpi"></i></div>
 </div>
 <nav>
  <button data-v="home" aria-current="true"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Início</button>
  <button data-v="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Buscar</button>
  <button data-v="lib"><svg viewBox="0 0 24 24"><path d="M4 4h2.5v16H4zM9 4h2.5v16H9zM14 6l2.4-.6 4 14.2-2.4.6z"/></svg>Sua Biblioteca</button>
 </nav>
</div>

<div class="fp" id="fp" hidden>
 <div class="hd"><button class="ib" id="fc" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div>Tocando da playlist<b>Costafy Mix</b></div><span style="width:38px"></span></div>
 <div class="art cover" id="fart"></div>
 <div class="ti"><div><h1 id="ft"></h1><span id="fa"></span></div><button class="ib" id="flk" aria-label="Curtir"></button></div>
 <input type="range" id="sk" min="0" max="1000" value="0" aria-label="Posição">
 <div class="tm"><span id="tc">0:00</span><span id="td">0:00</span></div>
 <div class="ctl">
  <button class="ib" id="sh" aria-label="Aleatório"><svg viewBox="0 0 24 24"><path d="M3 6h3.5c3 0 4 2 5.5 6s2.5 6 5.5 6H21M3 18h3.5c1.5 0 2.6-.6 3.5-1.6M14 7.2c.9-.7 1.9-1.2 3.5-1.2H21M18.5 3L21.5 6l-3 3M18.5 15l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="ib" id="pv" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6v12L9 12z"/></svg></button>
  <button class="ib big" id="fpp" aria-label="Tocar"></button>
  <button class="ib" id="nx" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l11 6-11 6z"/></svg></button>
  <span style="width:38px"></span>
 </div>
 <canvas id="cv" width="640" height="56"></canvas>
 <div class="vr">Volume<input type="range" id="vo" min="0" max="100" value="70" aria-label="Volume"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
